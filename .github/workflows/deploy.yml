name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Autenticación Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configurar Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configurar Docker
      run: gcloud auth configure-docker

    - name: Construir imagen Docker
      run: |
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/cicd-app .

    - name: Subir imagen a Google Container Registry
      run: |
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/cicd-app

    - name: Desplegar en Cloud Run
      run: |
        gcloud run deploy cicd-app \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cicd-app \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated
          